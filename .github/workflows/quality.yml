name: quality

on:
  push:
    branches:
      - main
      - "refactor/**"
  pull_request:

jobs:
  test-and-static-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck

      - name: Compile and run domain tests
        run: make -C refactored all

      - name: Run cppcheck
        run: make -C refactored lint
